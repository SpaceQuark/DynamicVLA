[project]
name = "dynamicvla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "isaacsim[all,extscache]==5.1.0",
    "isaaclab",
    "gymnasium",
    "easydict>=1.13",
    "h5py>=3.16.0",
    "imageio>=2.37.0",
    "lerobot==0.3.3",
    "num2words>=0.5.14",
    "numpy==1.26.0",
    "nvidia-ml-py>=13.595.45",
    "opencv-python-headless<4.12",
    "pylibmc>=1.6.3",
    "pytest>=9.0.3",
    "pyyaml>=6.0.2",
    "pyzmq>=27.1.0",
    "scipy>=1.15.3",
    "tensorboard>=2.20.0",
    "timm>=1.0.27",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.3",
    "transformers==5.2.0",
    "wandb>=0.26.1",
    "shapely>=2.1.2",
]


[tool.uv.sources]
omni-isaac-lab = { path = "../IsaacLab/source/isaaclab", editable = true }

[tool.uv]
override-dependencies = [
    "gymnasium==1.2.0",
    "packaging==23.0",    # This forces everyone (including LeRobot) to use 23.0
    "numpy==1.26.0",      # This forces everyone to use 1.26.0
    "pywin32; sys_platform == 'win32'"
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true
